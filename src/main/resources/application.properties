spring.application.name=maven-learn
logging.level.org.springframework = debug
spring.datasource.url=jdbc:mysql://localhost:3306/springLeaning?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true

# Format generated SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Database Dialect (Spring Boot auto-detects this usually, but you can specify it)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.profiles.active=dev